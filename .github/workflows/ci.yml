name: Build and regression checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Archive and library regression tests
        run: python tools/run_archive_tests.py
      - name: Python checks
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build Unicode launcher from source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64
          python tools/build_native.py
      - name: Install Android build dependencies
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Prepare pinned runtime
        run: python prepare_build.py
      - name: Build unsigned release
        working-directory: upstream/winlator-app-main
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --console=plain
      - name: Collect artifact and checksum
        run: |
          mkdir -p dist
          cp upstream/winlator-app-main/app/build/outputs/apk/release/app-release-unsigned.apk dist/StudySteady-ci-unsigned.apk
          cd dist
          sha256sum StudySteady-ci-unsigned.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: study-steady-unsigned-${{ github.sha }}
          path: dist/*
          retention-days: 14

